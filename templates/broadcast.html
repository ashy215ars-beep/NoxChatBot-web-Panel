{% extends "base.html" %}{% block heading %}ارسال پیام همگانی{% endblock %}{% block content %}
<div class="card"><h2>ارسال پیام به کاربران غیرمسدود</h2><p class="muted">گیرندگان فعلی: {{recipients}} نفر. ارسال فقط پس از تأیید نهایی انجام می‌شود؛ این عمل قابل برگشت نیست. پیام‌های تبلیغاتی ناخواسته نفرست.</p>
<form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="field"><label>متن پیام</label><textarea name="message" maxlength="4000" required placeholder="متن اطلاعیه..."></textarea></div><div class="field"><label class="checkline"><input type="checkbox" name="confirm" value="yes" required> ارسال این پیام به همه کاربران غیرمسدود را تأیید می‌کنم.</label></div><button class="primary" onclick="return confirm('پیام برای همه کاربران ارسال شود؟')">📣 ارسال همگانی</button></form></div>{% endblock %}
